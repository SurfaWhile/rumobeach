# Sveltia CMS-configuratie voor Rumo Beach. Gegenereerd uit src/data/*; velden toevoegen? Pas ook de site-code aan.
backend:
  name: "github"
  repo: "SurfaWhile/rumobeach"
  branch: "main"
site_url: "https://rumo-beach.netlify.app"
display_url: "https://rumo-beach.netlify.app"
media_folder: "public/images/rumobeach"
public_folder: "/images/rumobeach"
i18n:
  structure: "multiple_folders"
  locales:
    - "pt"
    - "en"
  default_locale: "pt"
collections:
  - name: "paginas"
    label: "Pagina's"
    i18n: true
    files:
      - name: "home"
        label: "Home"
        file: "src/data/{{locale}}/homepage.json"
        i18n: true
        fields:
          - label: "SEO (Google-resultaat)"
            name: "meta"
            widget: "object"
            i18n: true
            fields:
              - label: "Titel"
                name: "title"
                widget: "string"
                i18n: true
                hint: "Titel/beschrijving zoals getoond in Google. Titel ± 60 tekens, beschrijving ± 155."
              - label: "Beschrijving"
                name: "description"
                widget: "text"
                i18n: true
                hint: "Titel/beschrijving zoals getoond in Google. Titel ± 60 tekens, beschrijving ± 155."
          - label: "Bovenste beeld (hero)"
            name: "hero"
            widget: "object"
            i18n: true
            fields:
              - label: "Titel"
                name: "title"
                widget: "string"
                i18n: true
              - label: "Video (technisch, niet wijzigen)"
                name: "video"
                widget: "string"
                i18n: "duplicate"
                required: false
                hint: "Technisch veld (hero-video). Niet wijzigen."
              - label: "Afbeelding (poster)"
                name: "poster"
                widget: "image"
                required: false
                i18n: "duplicate"
              - label: "Ondertitel"
                name: "subtitle"
                widget: "string"
                i18n: true
          - label: "Intro"
            name: "intro"
            widget: "object"
            i18n: true
            fields:
              - label: "Kop"
                name: "heading"
                widget: "string"
                i18n: true
              - label: "Tekst"
                name: "body"
                widget: "text"
                i18n: true
          - label: "Kaarten"
            name: "cards"
            widget: "list"
            i18n: true
            fields:
              - label: "Titel"
                name: "title"
                widget: "string"
                i18n: true
              - label: "Tekst"
                name: "body"
                widget: "text"
                i18n: true
              - label: "Afbeelding"
                name: "image"
                widget: "image"
                required: false
                i18n: true
              - label: "Alt-tekst afbeelding (beschrijving voor screenreaders)"
                name: "imageAlt"
                widget: "string"
                i18n: true
              - label: "Link"
                name: "href"
                widget: "string"
                i18n: true
              - label: "Knoptekst"
                name: "buttonLabel"
                widget: "string"
                i18n: true
