backend:
  name: git-gateway
  branch: master

media_folder: "public/images/uploads"
public_folder: "/images/uploads"

publish_mode: simple

collections:
  - name: "pages"
    label: "Pagina's"
    files:
      - file: "src/data/homepage.json"
        name: "homepage"
        label: "Homepage"
        fields:
          - label: "Hero"
            name: "hero"
            widget: "object"
            fields:
              - { label: "Titel", name: "title", widget: "string" }
              - { label: "Video (mp4)", name: "video", widget: "file" }
              - { label: "Poster-afbeelding", name: "poster", widget: "image" }

          - label: "Intro (Beach Club)"
            name: "intro"
            widget: "object"
            fields:
              - { label: "Kop", name: "heading", widget: "string" }
              - { label: "Subkop", name: "subheading", widget: "string" }
              - { label: "Tekst", name: "body", widget: "text" }
              - { label: "Knoptekst", name: "buttonLabel", widget: "string" }
              - { label: "Knoplink", name: "buttonHref", widget: "string" }

          - label: "Fotostrip"
            name: "gallery"
            widget: "list"
            fields:
              - { label: "Afbeelding", name: "image", widget: "image" }
              - { label: "Alt-tekst", name: "alt", widget: "string" }

          - label: "Entre o mar e a mesa"
            name: "marEMesa"
            widget: "object"
            fields:
              - { label: "Kop", name: "heading", widget: "string" }
              - label: "Paragrafen"
                name: "paragraphs"
                widget: "list"
                field: { label: "Paragraaf", name: "text", widget: "text" }
              - { label: "Knoptekst", name: "buttonLabel", widget: "string" }
              - { label: "Knoplink", name: "buttonHref", widget: "string" }
              - { label: "Afbeelding", name: "image", widget: "image" }

          - label: "Surf Club"
            name: "surfClub"
            widget: "object"
            fields:
              - { label: "Kop", name: "heading", widget: "string" }
              - { label: "Tekst", name: "body", widget: "text" }
              - { label: "Afbeelding", name: "image", widget: "image" }
              - { label: "Adres voor kaart", name: "mapAddress", widget: "string" }

          - label: "Nieuwsbrief"
            name: "newsletter"
            widget: "object"
            fields:
              - { label: "Kop", name: "heading", widget: "string" }
              - { label: "Tekst", name: "body", widget: "text" }
              - { label: "Knoptekst", name: "buttonLabel", widget: "string" }

          - label: "Footer / contact"
            name: "footer"
            widget: "object"
            fields:
              - { label: "Adresregel 1", name: "addressLine1", widget: "string" }
              - { label: "Adresregel 2", name: "addressLine2", widget: "string" }
              - { label: "Openingstijden", name: "hours", widget: "string" }
              - { label: "E-mail", name: "email", widget: "string" }
              - { label: "Telefoon (label)", name: "phoneLabel", widget: "string" }
              - { label: "Telefoon (link, bv. WhatsApp)", name: "phoneHref", widget: "string" }
              - { label: "Facebook-link", name: "facebook", widget: "string" }
              - { label: "Instagram-link", name: "instagram", widget: "string" }
