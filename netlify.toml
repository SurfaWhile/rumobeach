[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22.20.0"

[dev]
  command = "npm run dev"
  port = 8888
  targetPort = 4321
  framework = "astro"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"

# /agenda/ heet nu /events/
[[redirects]]
  from = "/agenda"
  to = "/events/"
  status = 301
  force = true

[[redirects]]
  from = "/agenda/"
  to = "/events/"
  status = 301
  force = true

[[redirects]]
  from = "/en/agenda"
  to = "/en/events/"
  status = 301
  force = true

[[redirects]]
  from = "/en/agenda/"
  to = "/en/events/"
  status = 301
  force = true
